# Settings for the Actions runner, all keys: docker run --rm --entrypoint gitea-runner docker.gitea.com/act_runner:5.2.2 config generate
runner:
  file: /data/.runner
  capacity: 1
  labels:
    - "ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest"
container:
  # jobs clone and upload artifacts through ROOT_URL, this makes host.docker.internal reach the host on Linux as it does on Docker Desktop
  options: --add-host=host.docker.internal:host-gateway
