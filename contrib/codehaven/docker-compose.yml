name: codehaven

# Ports can be changed in .env when the defaults are already in use, see .env.example
services:
  gitea:
    build:
      context: ../..
    image: codehaven:local
    restart: unless-stopped
    environment:
      GITEA____APP_NAME: CodeHaven
      GITEA__ui__DEFAULT_THEME: codehaven-auto
      GITEA__ui__THEMES: codehaven-auto,codehaven-light,codehaven-dark,gitea-auto,gitea-light,gitea-dark
      # cross-repository code search on Explore → Code
      GITEA__indexer__REPO_INDEXER_ENABLED: "true"
      # outgoing email, see the mailer section of .env.example
      GITEA__mailer__ENABLED: ${MAILER_ENABLED:-false}
      GITEA__mailer__PROTOCOL: ${MAILER_PROTOCOL:-smtp+starttls}
      GITEA__mailer__SMTP_ADDR: ${MAILER_SMTP_ADDR:-}
      GITEA__mailer__SMTP_PORT: ${MAILER_SMTP_PORT:-587}
      GITEA__mailer__USER: ${MAILER_USER:-}
      GITEA__mailer__PASSWD: ${MAILER_PASSWORD:-}
      GITEA__mailer__FROM: ${MAILER_FROM:-}
      GITEA__server__ROOT_URL: ${CODEHAVEN_ROOT_URL:-http://localhost:${CODEHAVEN_HTTP_PORT:-3000}/}
      GITEA__server__SSH_PORT: ${CODEHAVEN_SSH_PORT:-2222}
      GITEA__jenkins__ENABLED: "true"
      GITEA__jenkins__URL: http://jenkins:8080
      GITEA__jenkins__PUBLIC_URL: http://localhost:${JENKINS_HTTP_PORT:-8080}
      GITEA__jenkins__USER: ${JENKINS_ADMIN_USER:-admin}
      GITEA__jenkins__TOKEN: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in .env, see .env.example}
      # Jenkins clones from inside the container network, where the browser address does not work
      GITEA__jenkins__CLONE_BASE_URL: http://gitea:3000
    ports:
      - "${CODEHAVEN_HTTP_PORT:-3000}:3000"
      - "${CODEHAVEN_SSH_PORT:-2222}:22"
    volumes:
      - codehaven-data:/data
      # mounted over the data volume's CustomPath (/data/gitea), so the branding lives in git, not in the volume
      - ./custom/public:/data/gitea/public:ro
      - ./custom/templates:/data/gitea/templates:ro
    depends_on:
      - jenkins

  jenkins:
    build:
      context: ./jenkins
    image: codehaven-jenkins:local
    restart: unless-stopped
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in .env, see .env.example}
      JENKINS_PUBLIC_URL: http://localhost:${JENKINS_HTTP_PORT:-8080}/
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - deploy-keys:/run/codehaven-keys:ro
    depends_on:
      keygen:
        condition: service_completed_successfully

  # stand-in for the deployment target, replace its host and SSH user in the repository's Deployments settings for a real VM
  test-vm:
    build:
      context: ./test-vm
    image: codehaven-test-vm:local
    restart: unless-stopped
    ports:
      - "${TEST_VM_HTTP_PORT:-8081}:8081"
    volumes:
      - deploy-keys:/run/codehaven-keys:ro
    depends_on:
      keygen:
        condition: service_completed_successfully

  # creates the deployment SSH key pair once, Jenkins gets the private key and the test VM trusts the public key
  keygen:
    image: alpine:3.22
    command: >-
      sh -c "[ -f /keys/id_ed25519 ] || { apk add --no-cache openssh-keygen >/dev/null && ssh-keygen -q -t ed25519 -N '' -C codehaven-deploy -f /keys/id_ed25519; };
      chown 1000:1000 /keys/id_ed25519 && chmod 600 /keys/id_ed25519"
    volumes:
      - deploy-keys:/keys

  # opens dependency update pull requests, started only with "docker compose --profile renovate up -d"
  renovate:
    image: renovate/renovate:41.100.0
    profiles: [renovate]
    restart: unless-stopped
    environment:
      RENOVATE_PLATFORM: gitea
      RENOVATE_ENDPOINT: http://gitea:3000/api/v1
      RENOVATE_TOKEN: ${RENOVATE_TOKEN:-}
      RENOVATE_AUTODISCOVER: "true"
      # clone through the container network, the browser address in clone URLs does not work in here
      RENOVATE_GIT_URL: endpoint
      RENOVATE_GIT_AUTHOR: ${RENOVATE_GIT_AUTHOR:-Renovate Bot <renovate-bot@noreply.localhost>}
      # optional, lets update pull requests include release notes from github.com
      GITHUB_COM_TOKEN: ${RENOVATE_GITHUB_COM_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do renovate; sleep ${RENOVATE_INTERVAL_SECONDS:-3600}; done"]
    depends_on:
      - gitea

  # runs Actions workflows such as the Trivy security scan, started only with "docker compose --profile actions up -d"
  runner:
    image: docker.gitea.com/act_runner:5.2.2
    profiles: [actions]
    restart: unless-stopped
    environment:
      # jobs run in their own containers and reach CodeHaven at ROOT_URL, so the runner uses it too
      GITEA_INSTANCE_URL: ${CODEHAVEN_ROOT_URL:-http://localhost:${CODEHAVEN_HTTP_PORT:-3000}/}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_REGISTRATION_TOKEN:-}
      GITEA_RUNNER_NAME: codehaven-runner
      CONFIG_FILE: /config.yaml
    volumes:
      - runner-data:/data
      - ./runner/config.yaml:/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - gitea

volumes:
  codehaven-data:
  runner-data:
  jenkins-home:
  deploy-keys:
